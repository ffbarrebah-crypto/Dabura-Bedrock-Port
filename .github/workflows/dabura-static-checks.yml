name: Dabura free static checks

on:
  push:
    branches:
      - main
      - "setup/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check repository contains testable add-on files
        shell: bash
        run: |
          set -euo pipefail
          js_count=$(find . -type f -name '*.js' -not -path './.git/*' | wc -l)
          json_count=$(find . -type f -name '*.json' -not -path './.git/*' | wc -l)
          echo "JavaScript files found: $js_count"
          echo "JSON files found: $json_count"
          if [ "$js_count" -eq 0 ] && [ "$json_count" -eq 0 ]; then
            echo "::error::No JavaScript or JSON add-on source files are committed yet. Upload the behavior-pack/resource-pack contents or a testable source snapshot before treating CI as a real test."
            exit 1
          fi

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking JS syntax: $file"
            node --check "$file"
          done < <(find . -type f -name '*.js' -not -path './.git/*' -print0)

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking JSON: $file"
            node -e 'JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done < <(find . -type f -name '*.json' -not -path './.git/*' -print0)

      - name: Report scope
        if: always()
        run: |
          echo "These checks validate JavaScript syntax and JSON parsing only."
          echo "They do not launch Minecraft Bedrock or verify in-game behavior, animations, sounds, or domain mechanics."
